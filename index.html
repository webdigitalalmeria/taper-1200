<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Táper · Plan 1.200 kcal</title>
<meta name="description" content="Tu plan de 1.200 kcal barato: qué comer hoy, batch cooking del domingo, lista de la compra automática y progreso de peso.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Táper">
<meta name="theme-color" content="#f4f2ec" id="meta-theme">
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d7a50'/%3E%3Crect x='14' y='26' width='36' height='22' rx='6' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M12 26h40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M28 19h8' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec;--bgT:rgba(244,242,236,.86);--card:#fff;--ink:#191c1a;--ink2:#3a3f3b;--muted:#737a74;--line:#e8e4da;--soft:#f0ede5;--soft2:#e7e3d8;
  --g:#1d7a50;--g2:#2a9d66;--gs:#e1f1e7;--o:#e0700c;--os:#fcecda;--b:#2d6ad4;--bs:#e4ecfb;--r:#d0453f;--rs:#fbe5e3;--y:#b98a04;--ys:#fbf2d4;
  --sh:0 1px 2px rgba(25,28,26,.04),0 6px 20px rgba(25,28,26,.05);--navbg:rgba(255,255,255,.9);color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d100f;--bgT:rgba(13,16,15,.86);--card:#161a18;--ink:#eef1ee;--ink2:#c9cfca;--muted:#8f9892;--line:#232926;--soft:#1d2320;--soft2:#262d29;
  --g:#3fcf88;--g2:#2fb673;--gs:rgba(63,207,136,.13);--o:#ff9d45;--os:rgba(255,157,69,.13);--b:#6ea8ff;--bs:rgba(110,168,255,.13);--r:#ff7a72;--rs:rgba(255,122,114,.13);--y:#f1c84b;--ys:rgba(241,200,75,.13);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--navbg:rgba(22,26,24,.9);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:15px;transition:background .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm svg.i,svg.i.sm{width:16px;height:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}

/* Top */
.top{position:sticky;top:0;z-index:30;background:var(--bgT);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:528px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--g),var(--g2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(29,122,80,.28)}
.logo svg{width:22px;height:22px}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);color:var(--ink2)}
.ibtn:active{transform:scale(.95)}
.tops{display:flex;gap:8px}

/* Generic */
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec .lnk{font-size:13.5px;font-weight:700;color:var(--g)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--os);color:var(--o)}
.chip.g{background:var(--gs);color:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:14px;font-weight:750;font-size:14.5px;background:var(--g);color:#fff}
[data-theme=dark] .btn{color:#06210f}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:active{transform:scale(.97)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{height:36px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:all .15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.muted{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Day nav + strip */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.daynav .lbl{text-align:center;flex:1}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--g)}
.dtitle{font-size:19px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.sd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:15px;background:var(--card);box-shadow:var(--sh);transition:all .15s}
.sd small{font-size:11.5px;font-weight:700;color:var(--muted)}
.sd b{font-size:15px;font-weight:800}
.sd i{width:6px;height:6px;border-radius:50%;background:var(--soft2)}
.sd.part i{background:var(--o)}
.sd.full i{background:var(--g)}
.sd.today b{color:var(--g)}
.sd.sel{background:var(--ink);color:var(--bg)}
.sd.sel small{color:var(--bg);opacity:.7}
.sd.sel b{color:var(--bg)}

/* Summary */
.hero{background:linear-gradient(150deg,var(--g) 0%,var(--g2) 100%);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(29,122,80,.25)}
[data-theme=dark] .hero{background:linear-gradient(150deg,#14553a 0%,#1d7a50 100%)}
.hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);right:-70px;top:-90px}
.hero:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.05);left:-50px;bottom:-70px}
.sum{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .rt{stroke:rgba(255,255,255,.18)}
.ring .rv{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.3,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.rc span{font-size:11.5px;font-weight:600;opacity:.85;margin-top:3px}
.macros{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.mrow .mt{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;opacity:.95}
.mrow .mt b{font-weight:800}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:#fff;transition:width .5s}
.hero-foot{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:700;color:#fff}
.hchip.on{background:#fff;color:var(--g)}
[data-theme=dark] .hchip.on{color:#14553a}

/* Meals */
.meal{background:var(--card);border-radius:22px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.meal.now{box-shadow:0 0 0 2px var(--g),var(--sh)}
.mh{display:flex;align-items:center;gap:13px;padding:14px 14px 14px 14px;cursor:pointer}
.mic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex-shrink:0}
.mic svg{width:22px;height:22px}
.c-o{background:var(--os);color:var(--o)}.c-r{background:var(--rs);color:var(--r)}.c-g{background:var(--gs);color:var(--g)}.c-b{background:var(--bs);color:var(--b)}
.mt2{flex:1;min-width:0}
.mslot{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--g);color:#fff}
[data-theme=dark] .badge{color:#06210f}
.mname{font-size:15.5px;font-weight:750;letter-spacing:-.01em;line-height:1.25;margin-top:2px}
.mmeta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.meal.done .mname{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--soft2);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .2s cubic-bezier(.3,1.5,.6,1)}
.chk svg{width:20px;height:20px;stroke-width:3}
.meal.done .chk{background:var(--g);border-color:var(--g);color:#fff;transform:scale(1.04)}
[data-theme=dark] .meal.done .chk{color:#06210f}
.mb{padding:0 16px 16px;border-top:1px solid var(--line);animation:fade .2s}
.opts{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none;margin:0 -2px}
.opts::-webkit-scrollbar{display:none}
.opt{flex-shrink:0;height:34px;padding:0 13px;border-radius:11px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink2)}
.opt.on{background:var(--ink);color:var(--bg)}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.itab{border-radius:14px;background:var(--soft);padding:4px 12px}
.ir{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ir:last-child{border-bottom:0}
.ir .n{font-weight:650;font-size:14px}
.ir .g{font-weight:800;font-size:14px;text-align:right}
.ir .h{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-weight:500}
.how{margin:0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;position:relative;padding:0 0 10px 34px;font-size:14px;color:var(--ink2)}
.how li:before{content:counter(s);position:absolute;left:0;top:0;width:23px;height:23px;border-radius:8px;background:var(--soft);font-size:12px;font-weight:800;display:grid;place-items:center;color:var(--ink)}
.extra{margin-top:4px;padding:9px 12px;border-radius:12px;background:var(--os);color:var(--o);font-size:13px;font-weight:700}
.mf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.mac{display:flex;gap:6px}
.mac span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:var(--soft);color:var(--ink2)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:11px;background:var(--os);color:var(--o);font-size:13px;font-weight:750}

/* Reminder + water */
.rem{display:flex;align-items:center;gap:13px}
.rem .mic{width:44px;height:44px}
.rem p{margin:0;font-size:14px;color:var(--ink2);flex:1}
.rem p b{color:var(--ink)}
.rbtn{height:38px;padding:0 13px;border-radius:12px;background:var(--bs);color:var(--b);font-size:13px;font-weight:750;white-space:nowrap;flex-shrink:0}
.rbtn.ok{background:var(--gs);color:var(--g)}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.water h4{margin:0;font-size:15px;font-weight:750}
.water small{font-size:12.5px;color:var(--muted);font-weight:600}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}
.gl{height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--soft2);transition:all .15s}
.gl svg{width:16px;height:16px}
.gl.on{background:var(--bs);color:var(--b)}

/* Week */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mc{text-align:left;padding:12px;border-radius:16px;background:var(--soft);border:2px solid transparent;transition:all .15s}
.mc.on{border-color:var(--g);background:var(--gs)}
.mc small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.mc b{display:block;font-size:14px;font-weight:750;margin-top:2px;line-height:1.25}
.mc span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.dnum{width:46px;flex-shrink:0;text-align:center}
.dnum small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dnum b{font-size:19px;font-weight:800}
.drow.today .dnum b{color:var(--g)}
.dinfo{flex:1;min-width:0;font-size:13.5px}
.dinfo div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.dinfo span{color:var(--muted);font-weight:600}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--soft2)}
.dots i.on{background:var(--g)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:13px 12px}
.st small{font-size:12px;font-weight:650;color:var(--muted);display:block}
.st b{font-size:21px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:3px}
.st span{font-size:11.5px;color:var(--muted);font-weight:600}

/* Cook */
.chero{background:var(--ink);color:var(--bg);border-radius:24px;padding:18px;margin-bottom:12px}
.chero small{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.65}
.chero h3{margin:4px 0 10px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.chero .row{display:flex;gap:8px;flex-wrap:wrap}
.chero .pill{height:30px;padding:0 11px;border-radius:999px;background:rgba(128,128,128,.22);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tl{position:relative;padding-left:4px}
.tli{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tli:last-child{padding-bottom:0}
.tli:before{content:"";position:absolute;left:25px;top:38px;bottom:2px;width:2px;background:var(--line)}
.tli:last-child:before{display:none}
.tm{width:44px;height:30px;border-radius:9px;background:var(--gs);color:var(--g);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.tli p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.tli p b{color:var(--ink)}
.rhead{display:flex;align-items:center;gap:12px;cursor:pointer}
.rhead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.rhead small{font-size:12.5px;color:var(--muted);font-weight:600}
.rot{transition:transform .2s;color:var(--muted)}
.rot.on{transform:rotate(180deg)}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--soft2);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .15s}
.box svg{width:15px;height:15px;stroke-width:3.2}
.ck.on .box{background:var(--g);border-color:var(--g);color:#fff}
[data-theme=dark] .ck.on .box{color:#06210f}
.ck .t{flex:1;min-width:0}
.ck .t b{display:block;font-size:14px;font-weight:650}
.ck .t span{display:block;font-size:12.5px;color:var(--muted)}
.ck.on .t b{text-decoration:line-through;color:var(--muted)}
.ck .q{font-size:13.5px;font-weight:800;white-space:nowrap}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.step:last-child{border-bottom:0}
.sn{width:26px;height:26px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.tip{display:flex;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bs);color:var(--ink2);font-size:13.5px;margin-top:12px}
.tip svg{color:var(--b);margin-top:1px}
.tups{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tup{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:14px;background:var(--soft);transition:all .15s}
.tup small{font-size:11.5px;font-weight:800;color:var(--muted)}
.tup .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.tup .ti svg{width:16px;height:16px}
.tup em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted)}
.tup.fz .ti{background:var(--bs);color:var(--b)}
.tup.fr .ti{background:var(--os);color:var(--o)}
.tup.ea{opacity:.5}
.tup.ea .ti{background:var(--gs);color:var(--g)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}

/* Shop */
.shop-sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pbar{height:8px;border-radius:9px;background:var(--soft2);overflow:hidden;margin:14px 0 12px}
.pbar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.aisle h3{display:flex;align-items:center;gap:9px;margin:0 0 4px;font-size:14.5px;font-weight:800}
.aisle h3 .mic{width:30px;height:30px;border-radius:10px}
.aisle h3 .mic svg{width:16px;height:16px}
.aisle h3 small{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.dtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--ys);color:var(--y);margin-left:6px;vertical-align:1px}
.addrow{display:flex;gap:8px;margin-top:10px}
.inp{flex:1;min-width:0;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;font-size:15px;outline:none}
.inp:focus{border-color:var(--g);background:var(--card)}
.del{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--r)}

/* Progress */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dw{font-size:11.5px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:11px;background:var(--soft);font-size:13.5px;font-weight:700;display:grid;place-items:center;position:relative}
.cd.x{background:none}
.cd.full{background:var(--g);color:#fff}
[data-theme=dark] .cd.full{color:#06210f}
.cd.part{background:var(--os);color:var(--o)}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.fut{color:var(--muted);opacity:.6}
.chart{width:100%;height:150px;display:block}
.wl{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.wl:last-child{border-bottom:0}
.eta{padding:12px 14px;border-radius:14px;background:var(--gs);color:var(--g);font-size:13.5px;font-weight:650;margin-top:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{font-size:14.5px;font-weight:700;display:block}
.setrow span{font-size:12.5px;color:var(--muted)}
.setrow .seg{margin:0;min-width:190px}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navbg);backdrop-filter:saturate(170%) blur(18px);-webkit-backdrop-filter:saturate(170%) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--g)}
.nb.on:before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--g)}

/* Timer pill */
.timer{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:45;width:calc(100% - 24px);max-width:536px;background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.3);transition:all .3s cubic-bezier(.2,.9,.3,1.2)}
.timer.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .tc{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--o)}
.timer.end .tc{color:var(--g);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.timer .tl2{flex:1;min-width:0;font-size:12.5px;font-weight:650;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{height:38px;min-width:38px;padding:0 10px;border-radius:12px;background:rgba(128,128,128,.25);font-size:13px;font-weight:750;display:grid;place-items:center}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:600px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--soft2);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.sheet h3{font-size:15.5px;font-weight:800;margin:0 0 8px}
.sheet p,.sheet li{font-size:14px;color:var(--ink2)}
.sheet ul{margin:0;padding-left:18px}
.sheet li{margin-bottom:6px}
.gtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.gtbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.gtbl tr:last-child td{border-bottom:0}
.gtbl td:first-child{font-weight:700;width:45%}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:700;transition:all .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>

const doneCount=s=>{const r=S.days[s];return r&&r.done?Object.values(r.done).filter(Boolean).length:0};

function plan(s){
  const d=parse(s),w=dow(d),M=MENUS[menuIdx(d)],r=S.days[s]||{},sel=r.sel||{},done=r.done||{};
  const list=[
    {id:'desayuno',slot:'Desayuno',time:'08:30',ic:'sun',col:'c-o',opts:BREAKFASTS,i:sel.desayuno??0},
    {id:'snack',slot:'Tentempié',time:'11:30 o 17:30',ic:'apple',col:'c-r',opts:SNACKS,i:sel.snack??0},
    {id:'comida',slot:'Comida · táper',time:'14:00',ic:'bowl',col:'c-g',opts:[M.o1,M.o2],i:sel.comida??LUNCH_DEF[w]},
    {id:'cena',slot:'Cena · 10 min',time:'21:00',ic:'moon',col:'c-b',opts:DINNERS,i:sel.cena??DINNER_DEF[w]}
  ];
  return list.map(m=>{
    m.i%=m.opts.length;const x=m.opts[m.i];
    Object.assign(m,{x,name:x.name,k:x.k,p:x.p,c:x.c,f:x.f,ing:x.ing||x.portion,how:x.how||REHEAT,timer:x.timer||(m.id==='comida'?[240,'Calentar táper']:null),done:!!done[m.id],extra:null});
    if(r.wo&&m.id==='desayuno'){m.k+=75;m.p+=3;m.c+=12;m.f+=1;m.extra='Día de entreno: añade 20 g más de avena (2 cucharadas).'}
    if(r.wo&&m.id==='cena'){m.k+=70;m.p+=6;m.f+=5;m.extra='Día de entreno: añade 1 huevo más.'}
    return m;
  });
}
const totals=ms=>ms.reduce((t,m)=>{t.K+=m.k;t.P+=m.p;t.C+=m.c;t.F+=m.f;if(m.done){t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f}return t},{K:0,P:0,C:0,F:0,k:0,p:0,c:0,f:0});

    <div class="tli"><span class="tm">0′</span><p><b>Prepara todo.</b> Saca ingredientes, lava legumbres y pica cebollas y zanahorias para las dos ollas de golpe.</p></div>

/* ---------- COMPRA ---------- */
function shopItems(k){const M=MENUS[menuIdx(parse(k))];const m=new Map();[...BASE_SHOP,...M.shop].forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});return [...m.values()].concat((S.custom[k]||[]).map(c=>({id:c.id,n:c.n,q:'Añadido por ti',p:0,a:'otros',u:0,custom:1})))}
function shopCost(k){const it=shopItems(k);return{real:it.reduce((a,x)=>a+x.p*x.u,0),ticket:it.reduce((a,x)=>a+x.p,0)}}

  const base=addD(monday(new Date()),7*U.shopOff),k=iso(base),M=MENUS[menuIdx(base)],items=shopItems(k),chk=S.shop[k]||{};

      ${list.map(x=>`<div style="display:flex;align-items:center;gap:4px"><button class="ck ${chk[x.id]?'on':''}" data-act="shop" data-k="${k}" data-id="${x.id}"><span class="box">${ic('check')}</span><span class="t"><b>${x.n}${x.d?'<span class="dtag">Despensa</span>':''}</b><span>${x.q}</span></span>${x.custom?'':`<span class="q num">${eur(x.p)}</span>`}</button>${x.custom?`<button class="del" data-act="delCustom" data-k="${k}" data-id="${x.id}" aria-label="Borrar">${ic('trash','sm')}</button>`:''}</div>`).join('')}

      <button class="btn ghost" style="flex:1" data-act="shareShop" data-k="${k}">${ic('share','sm')} Compartir lista</button>

}

function streak(){let d=new Date();if(doneCount(iso(d))<3)d=addD(d,-1);let n=0;while(doneCount(iso(d))>=3){n++;d=addD(d,-1)}return n}

  let cal=DS.map(x=>`<span class="dw">${x[0]}</span>`).join('');

  const W=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);

  let eta='';
  if(last!=null&&S.goal){const left=last-S.goal;eta=left<=0?`¡Has alcanzado tu meta de ${kg(S.goal)} kg! 🎉`:`Te faltan ${kg(left)} kg. A un ritmo sano de ~0,5 kg por semana, llegarías en unas <b>${Math.ceil(left/.5)} semanas</b>.`}

  </div>

    <div class="wnav" style="margin:0 0 12px">
      <button class="ibtn" data-act="cal" data-n="-1" aria-label="Mes anterior">${ic('l')}</button>

    </div>

  </div>
  <div class="sec"><h2>Peso</h2><button class="lnk" data-act="goal">${S.goal?`Meta: ${kg(S.goal)} kg`:'Fijar meta'}</button></div>
  <div class="card">
    <form class="addrow" data-form="weight" style="margin-top:0"><input class="inp num" name="kg" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="Peso de hoy en ayunas (kg)"><button class="btn" type="submit">Guardar</button></form>
    ${W.length?`
      <div style="display:flex;justify-content:space-between;margin:14px 2px 4px;font-size:13px;font-weight:650" class="muted"><span>Inicio: <b style="color:var(--ink)" class="num">${kg(firstW)} kg</b></span><span>Ahora: <b style="color:var(--ink)" class="num">${kg(last)} kg</b></span><span>Cambio: <b style="color:${last<=firstW?'var(--g)':'var(--r)'}" class="num">${last-firstW>0?'+':''}${kg(last-firstW)}</b></span></div>
      ${chart(W)}
      ${eta?`<div class="eta">${eta}</div>`:''}
      <div style="margin-top:8px">${W.slice(-6).reverse().map(w=>{const dd=parse(w.d);return `<div class="wl"><span class="muted">${dd.getDate()} ${MES[dd.getMonth()].slice(0,3)} ${dd.getFullYear()}</span><span style="display:flex;align-items:center;gap:8px"><b class="num">${kg(w.kg)} kg</b><button class="del" data-act="delW" data-d="${w.d}" aria-label="Borrar">${ic('trash','sm')}</button></span></div>`}).join('')}</div>`
    :`<p class="muted" style="font-size:13.5px;margin:12px 2px 0">Pésate una vez por semana, mismo día y en ayunas. El peso fluctúa a diario por agua; lo que importa es la tendencia.</p>`}

    <div class="setrow"><div><b>Tema</b><span>Automático sigue a tu iPhone</span></div>

    <div class="setrow"><div><b>Guía de uso</b><span>Cómo funciona, medidas y trucos</span></div><button class="ibtn" data-act="guide" aria-label="Abrir guía">${ic('r')}</button></div>
    <div class="setrow"><div><b style="color:var(--r)">Borrar todo</b><span>Empieza de cero</span></div><button class="ibtn" style="color:var(--r)" data-act="wipe" aria-label="Borrar todo">${ic('trash')}</button></div>

function chart(W){
  const pts=W.slice(-12),vals=pts.map(w=>w.kg).concat(S.goal?[S.goal]:[]);
  const mn=Math.min(...vals)-.6,mx=Math.max(...vals)+.6,w=340,h=150,px=20,py=22;
  const X=i=>pts.length===1?w/2:px+i*(w-2*px)/(pts.length-1),Y=v=>py+(mx-v)/(mx-mn)*(h-2*py);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${h} L${line.replace(/ /g,' L')} L${X(pts.length-1).toFixed(1)},${h} Z`;
  const gy=S.goal?Y(S.goal):null;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g)" stop-opacity=".25"/><stop offset="1" stop-color="var(--g)" stop-opacity="0"/></linearGradient></defs>
    ${gy!=null?`<line x1="0" x2="${w}" y1="${gy}" y2="${gy}" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${w-4}" y="${gy-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--b)">Meta ${kg(S.goal)}</text>`:''}
    ${pts.length>1?`<path d="${area}" fill="url(#ga)"/><polyline points="${line}" fill="none" stroke="var(--g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="4.5" fill="var(--card)" stroke="var(--g)" stroke-width="2.5"/>`).join('')}
  </svg>`;
}

/* ---------- Temporizador ---------- */
let tInt=null,beeped=false;
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=new A();[0,.35,.7].forEach(o=>[880,1175].forEach((f,j)=>{const os=ac.createOscillator(),g=ac.createGain();os.type='sine';os.frequency.value=f;const t=ac.currentTime+o+j*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);os.connect(g);g.connect(ac.destination);os.start(t);os.stop(t+.3)}))}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function tLeft(){const T=S.timer;if(!T)return 0;return T.run?Math.max(0,T.end-Date.now()):T.left}
function startTimer(sec,label){S.timer={label,run:true,end:Date.now()+sec*1000,left:sec*1000};beeped=false;save();tickTimer();toast(`Temporizador: ${label} · ${Math.round(sec/60)} min`)}
function tickTimer(){
  const el=document.getElementById('timer'),T=S.timer;
  if(!T){el.classList.remove('on');clearInterval(tInt);tInt=null;return}
  const ms=tLeft(),s=Math.ceil(ms/1000);
  el.classList.add('on');el.classList.toggle('end',s<=0);
  document.getElementById('tClock').textContent=s<=0?'¡Listo!':`${pad(Math.floor(s/60))}:${pad(s%60)}`;
  document.getElementById('tLabel').textContent=T.label;
  document.getElementById('tPause').innerHTML=ic(T.run&&s>0?'pause':'play','sm');
  if(s<=0&&T.run&&!beeped){beeped=true;beep();toast(`¡${T.label} listo!`)}
  if(!tInt)tInt=setInterval(tickTimer,500);
}

/* ---------- Render ---------- */
const SUB={hoy:'Plan 1.200 kcal',semana:'Tu semana',cocinar:'Batch cooking del domingo',compra:'Lista de la compra',progreso:'Tu progreso'};
function render(){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+U.tab));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.tab===U.tab));
  document.getElementById('tsub').textContent=SUB[U.tab];
  ({hoy:renderHoy,semana:renderSemana,cocinar:renderCocinar,compra:renderCompra,progreso:renderProgreso})[U.tab]();
}
function go(tab){U.tab=tab;render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('.nb');if(nb){go(nb.dataset.tab);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case 'pick':U.sel=ds.d;U.open=null;break;
    case 'day':U.sel=iso(addD(parse(U.sel),+ds.n));U.open=null;break;
    case 'today':U.sel=todayISO();U.open=null;break;
    case 'open':U.open=(U.open===ds.id||(U.open===null&&el.closest('.meal').querySelector('.mb')))?'none':ds.id;break;
    case 'done':{const r=dayRec(U.sel);r.done[ds.id]=!r.done[ds.id];save();if(r.done[ds.id]){toast('¡Hecho! Bien ahí 💪');U.open=null}break}
    case 'opt':{const r=dayRec(U.sel);r.sel[ds.id]=+ds.i;save();U.open=ds.id;break}
    case 'wo':{const r=dayRec(U.sel);r.wo=!r.wo;save();break}
    case 'water':{const r=dayRec(U.sel);r.water=r.water===+ds.n?+ds.n-1:+ds.n;save();break}
    case 'fridge':S.fridge[ds.d]=!S.fridge[ds.d];save();break;
    case 'timer':startTimer(+ds.s,ds.l);return;
    case 'tab':go(ds.t);return;
    case 'goday':U.sel=ds.d;U.open=null;go('hoy');return;
    case 'week':U.sel=iso(addD(parse(U.sel),+ds.n));break;
    case 'menu':S.menuOv[wk(parse(U.sel))]=+ds.i;save();toast('Menú cambiado: recetas y compra actualizadas');break;
    case 'menuAuto':delete S.menuOv[wk(parse(U.sel))];save();break;
    case 'cookOff':U.cookOff=+ds.n;break;
    case 'rec':U.openRec=U.openRec===ds.id?null:ds.id;break;
    case 'ing':S.ing[ds.k]=!S.ing[ds.k];if(!S.ing[ds.k])delete S.ing[ds.k];save();break;
    case 'tup':{const s=ds.d,r=dayRec(s),ea=!!r.done.comida,fr=!!S.fridge[s];
      if(!ea&&!fr)S.fridge[s]=true;else if(fr&&!ea){r.done.comida=true}else{r.done.comida=false;delete S.fridge[s]}save();break}
    case 'shopOff':U.shopOff=+ds.n;break;
    case 'shop':{S.shop[ds.k]??={};S.shop[ds.k][ds.id]=!S.shop[ds.k][ds.id];save();break}
    case 'delCustom':S.custom[ds.k]=(S.custom[ds.k]||[]).filter(x=>x.id!==ds.id);save();break;
    case 'hideDone':S.hideDone=!S.hideDone;save();break;
    case 'shareShop':{const k=ds.k,chk=S.shop[k]||{},it=shopItems(k).filter(x=>!chk[x.id]);
      const txt='🛒 Compra de la semana\n\n'+AISLES.map(([id,l])=>{const g=it.filter(x=>x.a===id);return g.length?`${l}\n`+g.map(x=>`• ${x.n} (${x.q})`).join('\n'):''}).filter(Boolean).join('\n\n');
      if(navigator.share)navigator.share({title:'Lista de la compra',text:txt}).catch(()=>{});
      else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada')).catch(()=>toast('No se pudo copiar'));return}
    case 'cal':{U.calM+=+ds.n;if(U.calM<0){U.calM=11;U.calY--}if(U.calM>11){U.calM=0;U.calY++}break}
    case 'goal':{const v=prompt('¿Cuál es tu peso objetivo? (kg)',S.goal?String(S.goal).replace('.',','):'');if(v===null)return;const n=parseFloat(v.replace(',','.'));if(n>=30&&n<=300){S.goal=Math.round(n*10)/10;save()}break}
    case 'delW':S.weights=S.weights.filter(w=>w.d!==ds.d);save();break;
    case 'setTheme':S.theme=ds.t;save();applyTheme();break;
    case 'theme':S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();applyTheme();toast(S.theme==='auto'?'Tema automático':S.theme==='light'?'Tema claro':'Tema oscuro');if(U.tab!=='progreso')return;break;
    case 'export':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`taper-copia-${todayISO()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Copia descargada');return}
    case 'import':document.getElementById('fileIn').click();return;
    case 'wipe':if(confirm('¿Seguro que quieres borrar todo tu historial? No se puede deshacer.')){S={};fix();save();toast('Datos borrados')}break;
    case 'guide':openGuide();return;
    case 'closeSheet':closeSheet();return;
    case 'tplus':if(S.timer){if(S.timer.run){S.timer.end=Math.max(S.timer.end,Date.now())+60000}else S.timer.left+=60000;beeped=false;save();tickTimer()}return;
    case 'tpause':{const T=S.timer;if(!T)return;if(tLeft()<=0){T.left=60000;T.run=true;T.end=Date.now()+60000;beeped=false}else if(T.run){T.left=T.end-Date.now();T.run=false}else{T.end=Date.now()+T.left;T.run=true}save();tickTimer();return}
    case 'tclose':S.timer=null;save();tickTimer();return;
  }
  if(U.open==='none')U.open='__none__';
  render();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='custom'){const v=f.n.value.trim();if(!v)return;const k=f.dataset.k;(S.custom[k]??=[]).push({id:'c'+Date.now(),n:v});save();render();const i=document.querySelector('[data-form=custom] input');i&&i.focus()}
  if(f.dataset.form==='weight'){const n=parseFloat(String(f.kg.value).replace(',','.'));if(!(n>=30&&n<=300)){toast('Escribe un peso válido');return}const d=todayISO();S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:Math.round(n*10)/10});save();toast('Peso guardado');render()}
});
document.getElementById('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o&&typeof o==='object'&&o.days){S=o;fix();save();applyTheme();render();toast('Copia restaurada')}else toast('Ese archivo no es una copia de Táper')}catch(x){toast('No se pudo leer el archivo')}};rd.readAsText(f);e.target.value=''});

/* Si se abre otro día, refresca "hoy" */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickTimer();if(U.tab==='hoy')render()}});

/* Icono de pantalla de inicio */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#1d7a50');g.addColorStop(1,'#2a9d66');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='#fff';x.lineWidth=11;x.lineCap='round';x.lineJoin='round';x.beginPath();x.roundRect?x.roundRect(42,78,96,58,16):x.rect(42,78,96,58);x.stroke();x.beginPath();x.moveTo(34,78);x.lineTo(146,78);x.stroke();x.beginPath();x.moveTo(76,56);x.lineTo(104,56);x.stroke();document.getElementById('apple-icon').href=c.toDataURL('image/png')}catch(e){}

applyTheme();render();tickTimer();
})();
</script>
</body>
